<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>WareSafe — পণ্য সামঞ্জস্যতা সহায়ক</title>
    <meta
      name="description"
      content="Warehouse product compatibility aid: check whether two products can be stored together using the GHS pictogram matrix."
    />
    <meta name="theme-color" content="#010066" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WareSafe" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/brand/logo-syngenta-navy.svg" />

    <!-- The Latin face is loaded before the stylesheets paint, so the
         first screen is already set in Montserrat. -->
    <link
      rel="preload"
      href="./assets/fonts/Montserrat-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/components.css" />
    <link rel="stylesheet" href="./styles/matrix.css" />
    <link rel="stylesheet" href="./styles/screens.css" />
  </head>
  <body>
    <div class="app">
      <main class="app__body" id="view" tabindex="-1"></main>

      <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
    </div>

    <!-- One shared bottom sheet. Only one sheet is ever open. -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <div
      class="sheet"
      id="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheet-title"
      hidden
    >
      <div class="sheet__grabber" aria-hidden="true"></div>
      <header class="sheet__header">
        <h2 class="sheet__title" id="sheet-title"></h2>
        <button class="bar__action" id="sheet-close" type="button" aria-label="Close"></button>
      </header>
      <div class="sheet__body" id="sheet-body"></div>
    </div>

    <div class="sr-only" id="live-region" role="status" aria-live="polite"></div>

    <noscript>
      <p style="padding: 24px">
        WareSafe needs JavaScript to work. Please enable it and reload the page.
      </p>
    </noscript>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
